<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reward Address Generator</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100vh}
.page-shell{min-height:100vh;display:grid;place-items:center;position:relative;overflow:hidden;padding:24px;background-image:linear-gradient(135deg,rgba(255,0,0,.28),rgba(255,165,0,.22),rgba(255,255,0,.18),rgba(0,255,128,.2),rgba(0,180,255,.22),rgba(120,0,255,.24),rgba(255,0,180,.2)),url("/background.jpg");background-position:center;background-size:cover;background-repeat:no-repeat}
.page-shell:after{content:"";position:absolute;inset:-40%;background:conic-gradient(from 0deg,rgba(255,0,0,.28),rgba(255,165,0,.28),rgba(255,255,0,.25),rgba(0,255,100,.25),rgba(0,180,255,.28),rgba(100,0,255,.28),rgba(255,0,160,.28),rgba(255,0,0,.28));filter:blur(70px);animation:spin 20s linear infinite;z-index:0}
.dollar-spray{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:1}
.dollar-spray span{position:absolute;font-size:clamp(42px,9vw,90px);font-weight:900;color:#86efac;text-shadow:0 4px 18px rgba(0,0,0,.42);opacity:.78;animation:money-fly 7s ease-in-out infinite}
.dollar-spray span:nth-child(1){left:4%;bottom:8%;animation-delay:-.4s}.dollar-spray span:nth-child(2){left:12%;bottom:30%;animation-delay:-2.8s}.dollar-spray span:nth-child(3){left:21%;bottom:12%;animation-delay:-5.1s}.dollar-spray span:nth-child(4){left:30%;top:14%;animation-delay:-1.7s}.dollar-spray span:nth-child(5){left:39%;top:7%;animation-delay:-4.2s}.dollar-spray span:nth-child(6){left:50%;top:18%;animation-delay:-2.1s}.dollar-spray span:nth-child(7){right:5%;top:10%;animation-delay:-5.7s}.dollar-spray span:nth-child(8){right:14%;top:32%;animation-delay:-3.2s}.dollar-spray span:nth-child(9){right:24%;bottom:8%;animation-delay:-6.2s}.dollar-spray span:nth-child(10){right:34%;bottom:22%;animation-delay:-1.2s}.dollar-spray span:nth-child(11){right:44%;bottom:7%;animation-delay:-4.8s}.dollar-spray span:nth-child(12){right:8%;bottom:34%;animation-delay:-2.5s}
.card{position:relative;z-index:3;width:min(560px,100%);padding:34px;border:1px solid rgba(255,255,255,.2);border-radius:28px;background:rgba(15,23,42,.74);backdrop-filter:blur(22px);box-shadow:0 30px 80px rgba(0,0,0,.35);color:#fff;animation:float 6s ease-in-out infinite}
.badge{display:inline-block;padding:7px 12px;border-radius:999px;background:linear-gradient(90deg,#a855f7,#06b6d4);font-size:11px;font-weight:800;letter-spacing:.16em}
h1{margin:18px 0 10px;font-size:clamp(30px,7vw,48px);line-height:1.04;letter-spacing:-.04em}
.instruction{margin:0 0 26px;color:#cbd5e1;font-size:15px;line-height:1.65}
label{display:block;margin-bottom:9px;color:#e2e8f0;font-size:13px;font-weight:700}
input{width:100%;height:56px;padding:0 17px;border:1px solid rgba(255,255,255,.16);border-radius:15px;outline:none;background:rgba(2,6,23,.55);color:#fff;font-size:15px}
input::placeholder{color:#64748b}input:focus{border-color:#22d3ee;box-shadow:0 0 0 4px rgba(34,211,238,.12)}
button{width:100%;height:56px;margin-top:14px;border:0;border-radius:15px;color:#fff;font-size:15px;font-weight:800;cursor:pointer;background:linear-gradient(90deg,#9333ea,#2563eb,#0891b2);background-size:200% 100%;box-shadow:0 12px 30px rgba(59,130,246,.25);transition:.25s}
button:hover:not(:disabled){transform:translateY(-2px);background-position:100% 0}button:disabled{opacity:.65;cursor:wait}
.result{margin-top:22px;padding:20px;border-radius:18px;border:1px solid rgba(34,211,238,.3);background:linear-gradient(135deg,rgba(8,47,73,.7),rgba(49,46,129,.45));animation:pop .35s ease-out}
.result span{display:block;margin-bottom:9px;color:#67e8f9;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.12em}
.result strong{display:block;overflow-wrap:anywhere;color:#fff;font-size:14px;line-height:1.55}
.copy-button{margin-top:12px;height:46px;background:rgba(255,255,255,.12);box-shadow:none}
.error{margin:14px 0 0;color:#fda4af;font-size:13px}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes float{50%{transform:translateY(-7px)}}@keyframes money-fly{0%,100%{transform:translate(0,20px) rotate(-10deg) scale(.9)}50%{transform:translate(28px,-34px) rotate(14deg) scale(1.08)}}@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
@media(max-width:480px){.page-shell{padding:16px}.card{padding:25px 20px;border-radius:23px}h1{font-size:34px}.instruction{font-size:14px}}
</style>
</head>
<body>
<main class="page-shell">
  <div class="dollar-spray" aria-hidden="true">
    <span>$</span><span>$</span><span>$</span><span>$</span><span>$</span><span>$</span>
    <span>$</span><span>$</span><span>$</span><span>$</span><span>$</span><span>$</span>
  </div>
  <section class="card">
    <div class="badge">ETHEREUM</div>
    <h1>Reward Address Generator</h1>
    <p class="instruction">Paste your wallet address in the box and click on the button to generate your reward address</p>
    <form id="form">
      <label for="wallet">Ethereum wallet address</label>
      <input id="wallet" placeholder="0x..." autocomplete="off" spellcheck="false">
      <button id="generate" type="submit">Generate Reward Address</button>
    </form>
    <p id="error" class="error" role="alert"></p>
    <div id="result" class="result" aria-live="polite" hidden>
      <span>Your Reward Address</span>
      <strong id="reward"></strong>
      <button id="copy" type="button" class="copy-button">Copy Address</button>
    </div>
  </section>
</main>
<script>
const form=document.getElementById('form'),wallet=document.getElementById('wallet'),generate=document.getElementById('generate'),error=document.getElementById('error'),result=document.getElementById('result'),reward=document.getElementById('reward'),copy=document.getElementById('copy');
form.addEventListener('submit',async e=>{e.preventDefault();error.textContent='';result.hidden=true;const value=wallet.value.trim();if(!/^0x[a-fA-F0-9]{40}$/.test(value)){error.textContent='Please enter a valid Ethereum wallet address.';return}generate.disabled=true;generate.textContent='Generating...';try{const r=await fetch('/.netlify/functions/generate-reward',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({walletAddress:value})});const data=await r.json();if(!r.ok)throw new Error(data.error||'Unable to generate a reward address.');reward.textContent=data.rewardAddress;result.hidden=false}catch(err){error.textContent=err.message||'Unable to generate a reward address. Please try again.'}finally{generate.disabled=false;generate.textContent='Generate Reward Address'}});
copy.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(reward.textContent);copy.textContent='Copied!';setTimeout(()=>copy.textContent='Copy Address',1800)}catch{error.textContent='Unable to copy the reward address. Please copy it manually.'}});
</script>
</body>
</html>
