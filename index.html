<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#17132f">
<meta name="description" content="RainbowClaim Ethereum reward address generator">
<title>RainbowClaim — Reward Address Generator</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100vh;background:#0b0820;color:#fff}.page-shell{min-height:100vh;display:grid;place-items:center;position:relative;overflow:hidden;padding:24px;background:radial-gradient(circle at 15% 15%,rgba(255,0,102,.3),transparent 30%),radial-gradient(circle at 85% 20%,rgba(0,212,255,.3),transparent 30%),radial-gradient(circle at 25% 90%,rgba(124,58,237,.32),transparent 35%),radial-gradient(circle at 80% 85%,rgba(34,197,94,.22),transparent 30%),#0b0820}.page-shell:before{content:"";position:absolute;inset:-45%;background:conic-gradient(from 0deg,#ff006e,#ff8a00,#ffe600,#00e676,#00cfff,#6c2cff,#ff00a8,#ff006e);filter:blur(95px);opacity:.3;animation:rainbowSpin 18s linear infinite}.page-shell:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at center,transparent 20%,rgba(5,3,20,.58) 100%);pointer-events:none}.dollar-spray{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:1}.dollar-spray span{position:absolute;font-size:clamp(38px,8vw,86px);font-weight:900;background:linear-gradient(135deg,#ffea00,#00e676,#00d9ff,#a855f7,#ff2d95);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 5px 16px rgba(255,255,255,.15));opacity:.55;animation:moneyFly 8s ease-in-out infinite}.dollar-spray span:nth-child(1){left:3%;bottom:7%;animation-delay:-.4s}.dollar-spray span:nth-child(2){left:12%;bottom:31%;animation-delay:-2.8s}.dollar-spray span:nth-child(3){left:22%;bottom:11%;animation-delay:-5.1s}.dollar-spray span:nth-child(4){left:31%;top:12%;animation-delay:-1.7s}.dollar-spray span:nth-child(5){left:40%;top:5%;animation-delay:-4.2s}.dollar-spray span:nth-child(6){left:50%;top:17%;animation-delay:-2.1s}.dollar-spray span:nth-child(7){right:4%;top:9%;animation-delay:-5.7s}.dollar-spray span:nth-child(8){right:13%;top:31%;animation-delay:-3.2s}.dollar-spray span:nth-child(9){right:23%;bottom:7%;animation-delay:-6.2s}.dollar-spray span:nth-child(10){right:34%;bottom:21%;animation-delay:-1.2s}.dollar-spray span:nth-child(11){right:44%;bottom:6%;animation-delay:-4.8s}.dollar-spray span:nth-child(12){right:7%;bottom:34%;animation-delay:-2.5s}.card{position:relative;z-index:3;width:min(560px,100%);padding:34px;border:1px solid rgba(255,255,255,.2);border-radius:30px;background:linear-gradient(145deg,rgba(18,15,48,.82),rgba(10,8,29,.68));backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);box-shadow:0 30px 90px rgba(0,0,0,.45),0 0 60px rgba(168,85,247,.14);color:#fff;animation:float 6s ease-in-out infinite}.card:before{content:"";position:absolute;inset:-1px;border-radius:31px;padding:1px;background:linear-gradient(120deg,#ff2d95,#ffb000,#00e676,#00d9ff,#8b5cf6,#ff2d95);background-size:300% 300%;animation:borderFlow 7s ease infinite;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude;pointer-events:none}.brand{display:flex;align-items:center;gap:10px}.logo{width:38px;height:38px;border-radius:12px;background:conic-gradient(#ff2d95,#ff8a00,#ffe600,#00e676,#00d9ff,#7c3aed,#ff2d95);box-shadow:0 0 24px rgba(0,217,255,.25)}.badge{display:inline-block;padding:7px 12px;border-radius:999px;background:linear-gradient(90deg,#ff2d95,#8b5cf6,#00d9ff);background-size:200% 100%;animation:gradientMove 5s ease infinite;font-size:11px;font-weight:900;letter-spacing:.16em}h1{margin:18px 0 10px;font-size:clamp(30px,7vw,48px);line-height:1.04;letter-spacing:-.04em;background:linear-gradient(90deg,#fff,#ffe600,#00e676,#00d9ff,#c084fc,#ff80b5,#fff);background-size:300% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:textRainbow 8s linear infinite}.instruction{margin:0 0 26px;color:#d6d1ec;font-size:15px;line-height:1.65}label{display:block;margin-bottom:9px;color:#eee9ff;font-size:13px;font-weight:700}.input-row{display:flex;gap:10px}input{width:100%;height:56px;padding:0 17px;border:1px solid rgba(255,255,255,.14);border-radius:15px;outline:none;background:rgba(4,2,22,.62);color:#fff;font-size:15px;user-select:text;-webkit-user-select:text;touch-action:manipulation;caret-color:#fff;transition:.25s}input::placeholder{color:#716b8e}input:focus{border-color:#00d9ff;box-shadow:0 0 0 4px rgba(0,217,255,.1),0 0 25px rgba(124,58,237,.18)}button{width:100%;height:56px;margin-top:14px;border:0;border-radius:15px;color:#fff;font-size:15px;font-weight:800;cursor:pointer;background:linear-gradient(90deg,#ff2d95,#8b5cf6,#00bfff,#00e676,#ffe600,#ff8a00,#ff2d95);background-size:300% 100%;animation:buttonRainbow 7s linear infinite;box-shadow:0 12px 32px rgba(139,92,246,.24);transition:.25s;touch-action:manipulation}button:hover:not(:disabled){transform:translateY(-2px) scale(1.01);box-shadow:0 15px 38px rgba(0,217,255,.2)}button:disabled{opacity:.65;cursor:wait;animation:none}.paste-button{width:auto;min-width:112px;margin-top:0;flex:0 0 auto;background:rgba(255,255,255,.1);animation:none;box-shadow:none}.result{margin-top:22px;padding:20px;border-radius:18px;border:1px solid rgba(0,217,255,.35);background:linear-gradient(135deg,rgba(0,217,255,.11),rgba(139,92,246,.18),rgba(255,45,149,.1));box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 10px 35px rgba(0,0,0,.15);animation:pop .35s ease-out}.result span{display:block;margin-bottom:9px;color:#67e8f9;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.12em}.result strong{display:block;overflow-wrap:anywhere;color:#fff;font-size:14px;line-height:1.55}.copy-button{margin-top:12px;height:46px;background:rgba(255,255,255,.1);animation:none;box-shadow:none}.error{margin:14px 0 0;color:#fda4af;font-size:13px}.card.input-active{animation:none}@keyframes rainbowSpin{to{transform:rotate(360deg)}}@keyframes float{50%{transform:translateY(-7px)}}@keyframes moneyFly{0%,100%{transform:translate(0,20px) rotate(-10deg) scale(.9)}50%{transform:translate(28px,-34px) rotate(14deg) scale(1.08)}}@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}@keyframes borderFlow{0%{background-position:0 50%}50%{background-position:100% 50%}100%{background-position:0 50%}}@keyframes gradientMove{50%{background-position:100% 0}}@keyframes textRainbow{to{background-position:300% center}}@keyframes buttonRainbow{to{background-position:300% 0}}@media(max-width:480px){.page-shell{padding:16px}.card{padding:25px 20px;border-radius:24px}.card:before{border-radius:25px}h1{font-size:34px}.instruction{font-size:14px}.input-row{gap:7px}.paste-button{min-width:92px;padding:0 10px}.dollar-spray span{opacity:.35}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<main class="page-shell">
<div class="dollar-spray" aria-hidden="true"><span>$</span><span>$</span><span>$</span><span>$</span><span>$</span><span>$</span><span>$</span><span>$</span><span>$</span><span>$</span><span>$</span><span>$</span></div>
<section class="card" id="card">
<div class="brand"><div class="logo" aria-hidden="true"></div><div class="badge">RAINBOWCLAIM</div></div>
<h1>Reward Address Generator</h1>
<p class="instruction">Paste your wallet address in the box and click the button to generate your reward address.</p>
<form id="form"><label for="wallet">Ethereum wallet address</label><div class="input-row"><input id="wallet" type="text" inputmode="text" autocapitalize="off" autocomplete="off" spellcheck="false" placeholder="0x..." aria-label="Ethereum wallet address"><button id="paste" type="button" class="paste-button">Paste</button></div><button id="generate" type="submit">Generate Reward Address</button></form>
<p id="error" class="error" role="alert"></p><div id="result" class="result" aria-live="polite" hidden><span>Your Reward Address</span><strong id="reward"></strong><button id="copy" type="button" class="copy-button">Copy Address</button></div>
</section></main>
<script>
const form=document.getElementById('form'),wallet=document.getElementById('wallet'),generate=document.getElementById('generate'),paste=document.getElementById('paste'),error=document.getElementById('error'),result=document.getElementById('result'),reward=document.getElementById('reward'),copy=document.getElementById('copy'),card=document.getElementById('card');
wallet.addEventListener('focus',()=>card.classList.add('input-active'));wallet.addEventListener('blur',()=>card.classList.remove('input-active'));
paste.addEventListener('click',async()=>{error.textContent='';try{const text=await navigator.clipboard.readText();wallet.focus();wallet.value=text.trim()}catch{error.textContent='Tap and hold the box and choose Paste, or allow clipboard access in your browser.'}});
form.addEventListener('submit',async e=>{e.preventDefault();error.textContent='';result.hidden=true;const value=wallet.value.trim();if(!/^0x[a-fA-F0-9]{40}$/.test(value)){error.textContent='Please enter a valid Ethereum wallet address.';return}generate.disabled=true;generate.textContent='Generating...';try{const r=await fetch('/.netlify/functions/generate-reward',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({walletAddress:value})});const data=await r.json();if(!r.ok)throw new Error(data.error||'Unable to generate a reward address.');reward.textContent=data.rewardAddress;result.hidden=false}catch(err){error.textContent=err.message||'Unable to generate a reward address. Please try again.'}finally{generate.disabled=false;generate.textContent='Generate Reward Address'}});
copy.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(reward.textContent);copy.textContent='Copied!';setTimeout(()=>copy.textContent='Copy Address',1800)}catch{error.textContent='Unable to copy the reward address. Please copy it manually.'}});
</script>
</body></html>
